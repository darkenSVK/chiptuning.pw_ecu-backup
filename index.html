<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECU Files Database – original ECU files, Bosch & VAG numbers</title>
<meta name="description" content="Free searchable archive of 2300+ original OEM ECU files (ZIP/RAR/ORI) with Bosch 0281/0261 and VAG 03G906021, 038906019, 06A906032 numbers. VW, Audi, Skoda, Seat, BMW, Opel, Peugeot, Citroen, Alfa Romeo.">
<meta name="keywords" content="original ECU file, ori file, ECU number, Bosch 0281, 0261, 03G906021, 038906019, EDC15, EDC16, EDC17, ME7, WinOLS">
<meta property="og:title" content="ECU Files Database">
<meta property="og:description" content="Search and download original ECU files by number, car or brand.">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1b1f24; --muted:#6a7380; --line:#e2e5ea;
    --accent:#0b6bcb; --accent-soft:#e6f0fb; --hit:#fff1a8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1216; --card:#171b21; --text:#e6e9ee; --muted:#8b94a1; --line:#2a3039;
      --accent:#4ea1ff; --accent-soft:#1a2a3d; --hit:#5a4b00;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}
  .sub a{color:var(--accent)}
  .search{position:sticky;top:0;background:var(--bg);padding:10px 0 12px;z-index:2}
  input{width:100%;padding:14px 16px;font-size:18px;border:2px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--text)}
  input:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--text);
    padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip small{opacity:.7;margin-left:4px}
  .stat{color:var(--muted);font-size:13px;margin:6px 0 0}
  .brand{margin-top:22px}
  .brand h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;margin:0 0 8px;color:var(--muted)}
  .list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row:hover{background:var(--accent-soft)}
  .fname{flex:1;min-width:0;word-break:break-word}
  .fname a{color:var(--text);text-decoration:none}
  .fname a:hover{color:var(--accent);text-decoration:underline}
  .nums{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
  .num{font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:2px 7px;
    border-radius:5px;background:var(--accent-soft);color:var(--accent);cursor:pointer;border:0}
  .dl{flex-shrink:0;color:var(--accent);text-decoration:none;font-size:13px;
    border:1px solid var(--line);border-radius:6px;padding:4px 10px}
  .dl:hover{border-color:var(--accent)}
  mark{background:var(--hit);color:inherit;border-radius:2px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .more{display:block;margin:14px auto 0;padding:8px 18px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
  footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
  footer a{color:var(--accent)}
  @media (max-width:640px){
    .row{flex-wrap:wrap}
    .nums{justify-content:flex-start;width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ECU Files Database</h1>
  <p class="sub">Original OEM ECU files (chiptuning.pw archive). Search by ECU number, car, engine or file name.
    <a href="https://github.com/darkenSVK/chiptuning.pw_ecu-backup">GitHub</a></p>

  <div class="search">
    <input id="q" type="search" placeholder="e.g. 0281010302, 03G906021, passat 1.9 tdi, AXR…" autocomplete="off" autofocus>
    <div class="chips" id="chips"></div>
    <p class="stat" id="stat">Loading…</p>
  </div>

  <div id="out"></div>

  <footer>
    For research, reference and archival purposes only. Click an ECU number to search for it.<br>
    Missing ECU? Open an issue on <a href="https://github.com/darkenSVK/chiptuning.pw_ecu-backup/issues">GitHub</a>.
  </footer>
</div>

<script>
const PAGE = 300;
let FILES = [];       // {b, d, f, n:[], key}
let brand = "ALL";
let limit = PAGE;

const norm = s => s.toUpperCase().replace(/[\s\-_.,()]/g, "");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function highlight(text, words){
  // oznac rozsahy najprv, potom escapuj -> ziadne vnorene <mark>
  const up = text.toUpperCase(), on = new Array(text.length).fill(false);
  for (const w of words){
    const W = w.toUpperCase(); if (!W) continue;
    let i = up.indexOf(W);
    while (i >= 0){ for (let k = i; k < i + W.length; k++) on[k] = true; i = up.indexOf(W, i + 1); }
  }
  let html = "", open = false;
  for (let k = 0; k < text.length; k++){
    if (on[k] && !open){ html += "<mark>"; open = true; }
    if (!on[k] && open){ html += "</mark>"; open = false; }
    html += esc(text[k]);
  }
  return open ? html + "</mark>" : html;
}

function href(r){
  return encodeURIComponent(r.d) + "/" + encodeURIComponent(r.f);
}

async function load(){
  const r = await fetch("ecu_index.json", {cache:"no-cache"});
  if (!r.ok) throw new Error("missing");
  const data = await r.json();
  FILES = data.files.map(x => ({...x, key: norm(x.f + " " + x.n.join(" "))}));
}

function chips(){
  const counts = {};
  FILES.forEach(r => counts[r.b] = (counts[r.b]||0)+1);
  const brands = ["ALL", ...Object.keys(counts).sort()];
  document.getElementById("chips").innerHTML = brands.map(b =>
    `<button class="chip ${b===brand?"on":""}" data-b="${b}">${b}<small>${b==="ALL"?FILES.length:counts[b]}</small></button>`
  ).join("");
}

function render(){
  const raw = document.getElementById("q").value.trim();
  const words = raw.split(/\s+/).filter(Boolean);
  const keys = words.map(norm).filter(Boolean);

  const hits = FILES.filter(r =>
    (brand==="ALL" || r.b===brand) && keys.every(k => r.key.includes(k)));

  document.getElementById("stat").textContent =
    `${hits.length} of ${FILES.length} files` + (raw ? ` matching "${raw}"` : "");

  const out = document.getElementById("out");
  if (!hits.length){ out.innerHTML = `<div class="empty">No match. Try fewer characters or another number.</div>`; return; }

  const shown = hits.slice(0, limit);
  const groups = {};
  shown.forEach(r => (groups[r.b] ||= []).push(r));

  out.innerHTML = Object.keys(groups).sort().map(b => `
    <div class="brand"><h2>${b} · ${hits.filter(h=>h.b===b).length}</h2><div class="list">
    ${groups[b].map(r => `
      <div class="row">
        <div class="fname"><a href="${href(r)}" download>${highlight(r.f, words)}</a></div>
        <div class="nums">${r.n.map(n => `<button class="num" data-n="${n}">${highlight(n, keys)}</button>`).join("")}</div>
        <a class="dl" href="${href(r)}" download>Download</a>
      </div>`).join("")}
    </div></div>`).join("")
    + (hits.length > limit ? `<button class="more" id="more">Show more (${hits.length - limit} left)</button>` : "");
}

function setQuery(v){
  const q = document.getElementById("q");
  q.value = v; limit = PAGE; render();
  try{ history.replaceState(null,"", v ? "#"+encodeURIComponent(v) : location.pathname); }catch(e){}
}

document.getElementById("q").addEventListener("input", e => setQuery(e.target.value));
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  brand = b.dataset.b; limit = PAGE; chips(); render();
});
document.getElementById("out").addEventListener("click", e => {
  const n = e.target.closest(".num");
  if (n){ setQuery(n.dataset.n); window.scrollTo({top:0, behavior:"smooth"}); return; }
  if (e.target.id === "more"){ limit += PAGE; render(); }
});

(async () => {
  try{ await load(); }
  catch(e){
    document.getElementById("stat").textContent =
      "Could not load ecu_index.json – run export_ecu_index.py and upload the file next to index.html.";
    return;
  }
  if (location.hash) document.getElementById("q").value = decodeURIComponent(location.hash.slice(1));
  chips(); render();
})();
</script>
</body>
</html>
